name: Build new Linux 6.6 LTS release

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  main:
    runs-on: ubuntu-latest
    container: archlinux:latest

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Install dependencies and clone repository
        run: |
          pacman -Syu --noconfirm base-devel git

          git config --global --add safe.directory "$(pwd)"
          git clone --recursive "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" .

      - name: Export current and last built version
        run: |
          LAST_BUILT_VERSION=$(grep "^pkgver=" hello/PKGBUILD | cut -d"=" -f2)
          git submodule update --remote
          CURRENT_VERSION=$(grep "^pkgver=" hello/PKGBUILD | cut -d"=" -f2)

          echo "Last built version: $LAST_BUILT_VERSION"
          echo "Current version: $CURRENT_VERSION"

          echo "LAST_BUILT_VERSION=$LAST_BUILT_VERSION" >> $GITHUB_ENV
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV

      - name: Create dedicated user for build
        if: ${{ env.CURRENT_VERSION != env.LAST_BUILT_VERSION || github.event_name == 'workflow_dispatch' }}
        run: |
          cd hello

          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder

          echo "${{ secrets.GPG_PRIVATE_KEY_ENCRYPTED }}" | base64 -d > private.key.gpg
          gpg --batch --passphrase "${{ secrets.GPG_PASSPHRASE }}" --decrypt private.key.gpg | \
            sudo -u builder gpg --batch --import

          sudo -u builder gpg --batch --locate-keys torvalds@kernel.org
          sudo -u builder gpg --batch --locate-keys gregkh@kernel.org

          chown -R builder .

      - name: Build kernel packages
        if: ${{ env.CURRENT_VERSION != env.LAST_BUILT_VERSION || github.event_name == 'workflow_dispatch' }}
        run: |
          cd hello

          echo "PACKAGER='bemxio <bemxiov@protonmail.com>'" >> /home/builder/.makepkg.conf
          echo "GPGKEY='F95B3E58A1558E613975F551D6BA2CBC66075B2B'" >> /home/builder/.makepkg.conf
          echo "MAKEFLAGS='-j$(nproc)'" >> /home/builder/.makepkg.conf

          sudo -u builder makepkg --syncdeps --sign --noconfirm

      - name: Create repository for packages
        if: ${{ env.CURRENT_VERSION != env.LAST_BUILT_VERSION || github.event_name == 'workflow_dispatch' }}
        run: |
          mkdir linux-lts66-repo
          cd linux-lts66-repo

          cp ../*.html .

          find ../hello -type f -name *.pkg.tar.zst -exec mv {} . \;
          sudo -u builder repo-add --sign linux-lts66.db.tar.zst *.pkg.tar.zst

      - name: Upload repository as artifact
        if: ${{ env.CURRENT_VERSION != env.LAST_BUILT_VERSION || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: linux-lts66-repo/

      - name: Deploy to GitHub Pages
        if: ${{ env.CURRENT_VERSION != env.LAST_BUILT_VERSION || github.event_name == 'workflow_dispatch' }}
        uses: actions/deploy-pages@v4

      - name: Update submodules
        if: ${{ env.CURRENT_VERSION != env.LAST_BUILT_VERSION }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          git add hello
          git commit -m "$CURRENT_VERSION"
          git push origin main