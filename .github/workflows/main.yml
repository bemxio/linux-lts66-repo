name: Build new Linux 6.6 LTS release

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  main:
    runs-on: ubuntu-latest
    container: archlinux:latest

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Install dependencies and clone repository
        run: |
          pacman -Syu --noconfirm base-devel git

          git config --global --add safe.directory "$(pwd)"
          git clone --recursive "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" .

      - name: Export current and last built version
        run: |
          LAST_BUILT_VERSION=$(grep "^pkgver=" linux-lts66/PKGBUILD | cut -d"=" -f2)
          git submodule update --remote
          CURRENT_VERSION=$(grep "^pkgver=" linux-lts66/PKGBUILD | cut -d"=" -f2)

          echo "Last built version: $LAST_BUILT_VERSION"
          echo "Current version: $CURRENT_VERSION"

          echo "LAST_BUILT_VERSION=$LAST_BUILT_VERSION" >> $GITHUB_ENV
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV

      - name: Create dedicated user for build
        if: ${{ env.CURRENT_VERSION != env.LAST_BUILT_VERSION }}
        run: |
          cd linux-lts66

          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder

          sudo -u builder gpg --locate-keys torvalds@kernel.org
          sudo -u builder gpg --locate-keys gregkh@kernel.org

          chown -R builder .

      - name: Build kernel packages
        if: ${{ env.CURRENT_VERSION != env.LAST_BUILT_VERSION }}
        run: |
          cd linux-lts66 && sudo -u builder MAKEFLAGS="-j$(nproc)" makepkg -s --noconfirm

      - name: Create repository for packages
        if: ${{ env.CURRENT_VERSION != env.LAST_BUILT_VERSION }}
        run: |
          mkdir linux-lts66-repo
          cd linux-lts66-repo

          find ../linux-lts66 -type f -name *.pkg.tar.zst -exec mv {} . \;
          repo-add linux-lts66.db.tar.zst *.pkg.tar.zst

      - name: Upload repository as artifact
        if: ${{ env.CURRENT_VERSION != env.LAST_BUILT_VERSION }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: linux-lts66-repo/

      - name: Deploy to GitHub Pages
        if: ${{ env.CURRENT_VERSION != env.LAST_BUILT_VERSION }}
        uses: actions/deploy-pages@v4

      - name: Update submodules
        if: ${{ env.CURRENT_VERSION != env.LAST_BUILT_VERSION }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          git add linux-lts66
          git commit -m "$CURRENT_VERSION"
          git push origin main
